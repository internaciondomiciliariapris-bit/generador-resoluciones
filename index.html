<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Resoluciones — PRIS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Arial,sans-serif;background:#f0f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:white;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.10);width:100%;max-width:560px;overflow:hidden}
.header{background:#1a56a0;padding:22px 32px;display:flex;align-items:center;gap:14px}
.header h1{font-size:19px;color:white;font-weight:700}
.header p{font-size:12px;color:#cce0f5;margin-top:2px}
.body{padding:28px 32px}
.stitle{font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.field{margin-bottom:14px}
label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px}
label span{color:#dc2626}
input{width:100%;padding:9px 13px;border:1.5px solid #d1d5db;border-radius:7px;font-size:15px;color:#1a2b4a;outline:none;transition:border-color .15s}
input:focus{border-color:#1a56a0;box-shadow:0 0 0 3px rgba(26,86,160,.1)}
input.ro{background:#f8fafc;color:#374151;cursor:default}
.hint{font-size:11px;color:#94a3b8;margin-top:3px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
hr{border:none;border-top:1.5px solid #e2e8f0;margin:20px 0 16px}
.btn{width:100%;padding:14px;background:#1a56a0;color:white;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px;transition:background .15s}
.btn:hover{background:#154482}
.btn:disabled{background:#94a3b8;cursor:not-allowed}
.msg{margin-top:12px;padding:11px 15px;border-radius:7px;font-size:14px;display:none}
.ok{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;display:block}
.er{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;display:block}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div>
      <h1>📋 Generador de Resoluciones</h1>
      <p>Programa Integrado de Salud — Ministerio de Salud Pública de Tucumán</p>
    </div>
  </div>
  <div class="body">
    <div class="stitle">Datos del encabezado</div>
    <div class="row">
      <div class="field">
        <label>Fecha <span>*</span></label>
        <input id="fecha" placeholder="1 de Julio de 2026">
      </div>
      <div class="field">
        <label>Nº Resolución <span>*</span></label>
        <input id="nroRes" placeholder="2987">
      </div>
    </div>
    <div class="field">
      <label>Paciente — Apellido, Nombre <span>*</span></label>
      <input id="paciente" placeholder="GARCIA, JUAN CARLOS">
      <div class="hint">En MAYÚSCULAS</div>
    </div>
    <div class="field">
      <label>Insumo <span>*</span></label>
      <input id="insumo" placeholder="1-ANTEOJOS">
      <div class="hint">Ej: 1-ANTEOJOS / 2-ANTEOJOS / 1-SILLA DE RUEDAS</div>
    </div>
    <hr>
    <div class="stitle">Valores económicos</div>
    <div class="field">
      <label>Precio <span>*</span></label>
      <input id="precio" placeholder="38000" oninput="actualizarLetras()">
      <div class="hint">Solo el número — Ej: 38000</div>
    </div>
    <div class="field">
      <label>Importe en letras (se completa solo)</label>
      <input id="letras" class="ro" readonly>
    </div>
    <button class="btn" id="btn" onclick="generar()">⬇️ Generar y descargar Resolución</button>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script>

async function generar(){
  const fecha=document.getElementById("fecha").value.trim();
  const nro=document.getElementById("nroRes").value.trim();
  const pac=document.getElementById("paciente").value.trim();
  const ins=document.getElementById("insumo").value.trim();
  const raw=document.getElementById("precio").value.replace(/[^0-9]/g,"");
  const let_=document.getElementById("letras").value.trim();
  const msg=document.getElementById("msg");
  msg.className="msg";
  if(!fecha||!nro||!pac||!ins||!raw||!let_){msg.className="msg er";msg.textContent="⚠️ Completá todos los campos.";return;}
  const n=parseInt(raw);
  const fmt=n.toLocaleString("es-AR");
  const pu="$ "+fmt, pt="$ "+fmt+",00", im="$ "+fmt+", 00";
  const btn=document.getElementById("btn");
  btn.disabled=true;btn.textContent="⏳ Generando...";
  try{
    const zip=new JSZip();
    for(const[name,data]of Object.entries(TF)){
      if(name==="word/document.xml"){
        let xml=new TextDecoder("utf-8").decode(b64(data));
        xml=xml.replaceAll("__FECHA__",fecha).replaceAll("__NRO_RES__",nro).replaceAll("__PACIENTE__",pac)
              .replaceAll("__INSUMO_CORTO__",ins).replaceAll("__PRECIO_UNIT__",pu)
              .replaceAll("__PRECIO_TOTAL__",pt).replaceAll("__IMPORTE__",im).replaceAll("__IMPORTE_LETRAS__",let_);
        zip.file(name,xml);
      }else{zip.file(name,b64(data));}
    }
    const blob=await zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",compression:"DEFLATE"});
    const ap=pac.split(",")[0].trim().replace(/ /g,"_");
    const nombre="Resolucion_"+nro+"_"+ap+".docx";
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=nombre;a.click();URL.revokeObjectURL(url);
    msg.className="msg ok";msg.textContent="✅ Descargado: "+nombre;
  }catch(e){msg.className="msg er";msg.textContent="❌ Error: "+e.message;}
  btn.disabled=false;btn.textContent="⬇️ Generar y descargar Resolución";
}
</script>
