<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Resoluciones — PRIS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Arial,sans-serif;background:#f0f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:white;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.10);width:100%;max-width:560px;overflow:hidden}
.header{background:#1a56a0;padding:22px 32px}
.header h1{font-size:19px;color:white;font-weight:700}
.header p{font-size:12px;color:#cce0f5;margin-top:2px}
.body{padding:28px 32px}
.stitle{font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.field{margin-bottom:14px}
label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px}
label span{color:#dc2626}
input{width:100%;padding:9px 13px;border:1.5px solid #d1d5db;border-radius:7px;font-size:15px;color:#1a2b4a;outline:none}
input:focus{border-color:#1a56a0;box-shadow:0 0 0 3px rgba(26,86,160,.1)}
input.ro{background:#f8fafc;color:#374151}
.hint{font-size:11px;color:#94a3b8;margin-top:3px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
hr{border:none;border-top:1.5px solid #e2e8f0;margin:20px 0 16px}
.btn{width:100%;padding:14px;background:#1a56a0;color:white;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px}
.btn:hover{background:#154482}
.btn:disabled{background:#94a3b8;cursor:not-allowed}
.msg{margin-top:12px;padding:11px 15px;border-radius:7px;font-size:14px;display:none}
.ok{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;display:block}
.er{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;display:block}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>📋 Generador de Resoluciones</h1>
    <p>Programa Integrado de Salud — Ministerio de Salud Pública de Tucumán</p>
  </div>
  <div class="body">
    <div class="stitle">Datos del encabezado</div>
    <div class="row">
      <div class="field"><label>Fecha <span>*</span></label>
        <input id="fecha" placeholder="1 de Julio de 2026"></div>
      <div class="field"><label>Nº Resolución <span>*</span></label>
        <input id="nroRes" placeholder="2987"></div>
    </div>
    <div class="field"><label>Paciente — Apellido, Nombre <span>*</span></label>
      <input id="paciente" placeholder="GARCIA, JUAN CARLOS">
      <div class="hint">En MAYÚSCULAS</div></div>
    <div class="field"><label>Insumo <span>*</span></label>
      <input id="insumo" placeholder="1-ANTEOJOS">
      <div class="hint">Ej: 1-ANTEOJOS / 2-ANTEOJOS / 1-SILLA DE RUEDAS</div></div>
    <hr>
    <div class="stitle">Valores económicos</div>
    <div class="field"><label>Precio <span>*</span></label>
      <input id="precio" placeholder="38000" oninput="actualizarLetras()">
      <div class="hint">Solo el número — Ej: 38000</div></div>
    <div class="field"><label>Importe en letras (automático)</label>
      <input id="letras" class="ro" readonly></div>
    <button class="btn" id="btn" onclick="generar()">⬇️ Generar y descargar Resolución</button>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script>
const _u=["","Un","Dos","Tres","Cuatro","Cinco","Seis","Siete","Ocho","Nueve","Diez","Once","Doce","Trece","Catorce","Quince","Dieciseis","Diecisiete","Dieciocho","Diecinueve","Veinte","Veintiun","Veintidos","Veintitres","Veinticuatro","Veinticinco","Veintiseis","Veintisiete","Veintiocho","Veintinueve"];
const _d=["","Diez","Veinte","Treinta","Cuarenta","Cincuenta","Sesenta","Setenta","Ochenta","Noventa"];
const _c=["","Ciento","Doscientos","Trescientos","Cuatrocientos","Quinientos","Seiscientos","Setecientos","Ochocientos","Novecientos"];
function m100(n){if(n===0)return"";if(n===100)return"Cien";if(n<30)return _u[n];if(n<100){const d=Math.floor(n/10),u=n%10;return u===0?_d[d]:_d[d]+" y "+_u[u].toLowerCase();}const c=Math.floor(n/100),r=n%100;return _c[c]+(r>0?" "+m100(r):"");}
function numLetras(n){if(n===0)return"Cero";let r="";const M=Math.floor(n/1000000),K=Math.floor((n%1000000)/1000),R=n%1000;if(M>0)r+=(M===1?"Un Millon":m100(M)+" Millones")+" ";if(K>0)r+=(K===1?"Mil":m100(K)+" Mil")+" ";if(R>0)r+=m100(R);return r.trim();}
function actualizarLetras(){
  const raw=document.getElementById("precio").value.replace(/[^0-9]/g,"");
  const n=parseInt(raw);
  document.getElementById("letras").value=(!isNaN(n)&&n>0)?numLetras(n)+" pesos con 00/100":"";
}
async function generar(){
  const fecha=document.getElementById("fecha").value.trim();
  const nroRes=document.getElementById("nroRes").value.trim();
  const paciente=document.getElementById("paciente").value.trim();
  const insumo=document.getElementById("insumo").value.trim();
  const precio=document.getElementById("precio").value.replace(/[^0-9]/g,"");
  const importeLetras=document.getElementById("letras").value.trim();
  const msg=document.getElementById("msg");
  msg.className="msg";
  if(!fecha||!nroRes||!paciente||!insumo||!precio||!importeLetras){
    msg.className="msg er";msg.textContent="Completa todos los campos.";return;}
  const btn=document.getElementById("btn");
  btn.disabled=true;btn.textContent="Generando...";
  try{
    const resp=await fetch("/api/generar",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({fecha,nroRes,paciente,insumo,precio,importeLetras})
    });
    if(!resp.ok){const e=await resp.json();throw new Error(e.error);}
    const blob=await resp.blob();
    const apellido=paciente.split(",")[0].trim().replace(/ /g,"_");
    const nombre="Resolucion_"+nroRes+"_"+apellido+".docx";
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=nombre;a.click();
    URL.revokeObjectURL(url);
    msg.className="msg ok";msg.textContent="Descargado: "+nombre;
  }catch(e){msg.className="msg er";msg.textContent="Error: "+e.message;}
  btn.disabled=false;btn.textContent="Generar y descargar Resolucion";
}
</script>
</body>
</html>
